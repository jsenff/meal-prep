<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meal Prep</title>
<style>
  body{font-family:system-ui,sans-serif;margin:24px;max-width:1300px}
  table{border-collapse:collapse;width:100%}
  th,td{border:1px solid #ccc;padding:4px 6px;font-size:14px;vertical-align:top}
  th{background:#f3f3f3}
  th,td{transition:opacity .2s,background .2s}
  th.dayon{background:#e2eddb}
  td.dayon{background:#f3f8ef}
  .dayoff{opacity:.5;filter:grayscale(1)}
  select{width:100%}
  section{margin-bottom:32px}
  input,select,button{padding:4px}
  .row{display:flex;gap:8px;margin:6px 0;align-items:center}
  .who{display:flex;gap:10px;margin-top:4px;font-size:12px;color:#555}
  .who label{display:flex;align-items:center;gap:3px}
  .who input{padding:0}
  .guestrow{margin-top:2px;font-size:12px;color:#555}
  .guestrow label{display:flex;align-items:center;gap:3px}
  .guestrow input{padding:0}
  .weekhead{display:flex;align-items:center;gap:12px;margin:16px 0 6px}
  .weekhead h3{margin:0}
  .badge{font-size:12px;font-weight:normal;color:#4a7a3a;background:#e2eddb;border-radius:10px;padding:1px 8px}
  .weekpick{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:8px 12px;border:1px solid #9bc58a;
            background:#f3f8ef;border-radius:6px;font-size:14px}
  .weekpick label{display:flex;align-items:center;gap:4px}
  .weekpick input{padding:0}
  .wk{font-size:16px;font-weight:normal;color:#4a7a3a}
  .status{font-size:13px;color:#555}
  .status.err{color:#b00}
  .note{font-size:13px;color:#666}
  .warn{color:#b60;font-size:12px;margin-top:4px}
  .cookinfo{font-size:13px;color:#666;margin-bottom:10px}
  .cookinfo button{padding:1px 6px;font-size:12px;margin-left:6px}
  .cooks{display:flex;gap:24px;flex-wrap:wrap}
  .cook{flex:1;min-width:380px;border:1px solid #ccc;border-radius:6px;padding:12px 16px;
        transition:opacity .2s,filter .2s,background .2s}
  .cook.active{background:#f3f8ef;border-color:#9bc58a;box-shadow:0 0 0 2px #e2eddb}
  .cook.faded{opacity:.5;filter:grayscale(1)}
  .cookhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .cookpick{display:flex;align-items:center;gap:5px;font-size:13px;color:#444;white-space:nowrap}
  .cookpick input{padding:0}
  .cook h3{margin:0 0 2px}
  .cook .sub{color:#666;font-size:13px;margin-bottom:10px}
  .dish{margin:10px 0;padding-bottom:8px;border-bottom:1px dashed #ddd}
  .dish .title{font-weight:600}
  .dish .eat{color:#666;font-size:13px}
  .dish ul{margin:4px 0 0 18px;padding:0;font-size:14px}
  details{margin-bottom:6px}
  .cat td{background:#eaf0f6;font-weight:600}
  .done td{color:#999;text-decoration:line-through}
  .tickcol{width:32px;text-align:center}
  #shop table{width:auto;min-width:420px}
  #shop th:nth-child(2),#shop td:nth-child(2){min-width:240px}
  #shop th:nth-child(3),#shop td:nth-child(3){min-width:90px}
  .staplelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2px 24px;font-size:14px;margin:8px 0 16px}
  .staplelist label{display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:6px;padding:3px 6px;border-bottom:1px solid #eee}
  .staplelist label:hover{background:#f7f7f7}
  .staplelist label.off{color:#aaa}
  .staplelist input{padding:0;margin:0}
  .staplelist .sq{color:#888;font-size:12px;white-space:nowrap}  .gray{color:#888;font-size:12px}
</style>
</head>
<body>
<h1>Meal Prep</h1>

<section>
  <h2>Meal library</h2>
  <div class="row"><button id="reload">Reload from sheet</button><a id="sheetlink" href="#" target="_blank" rel="noopener" style="display:none">Open Google Sheet</a><span id="status" class="status"></span></div>
  <div id="meals"></div>
</section>

<section>
  <h2>Week plan</h2>
  <div class="note" id="plannote"></div>
  <div id="plan"></div>
</section>

<section>
  <div id="weekpick"></div>
</section>

<section><h2>Batch cook <span id="cookwk" class="wk"></span></h2><div id="cook"></div></section>

<section>
  <h2>Shopping list <span id="shopwk" class="wk"></span></h2>
  <h3>Staples</h3>
  <div class="note">Untick anything you already have this week.</div>
  <div id="staples"></div>
  <h3>To buy</h3>
  <div class="row"><button id="clearTicks">Clear ticks</button><span id="tickinfo" class="status"></span></div>
  <div id="shop"></div>
</section>

<section>
  <button id="exp">Export plan JSON</button>
  <input type="file" id="imp" accept=".json">
</section>

<script>
window.onerror=(msg,src,line)=>{document.body.insertAdjacentHTML('afterbegin',
  `<pre style="color:#b00">Error: ${msg} (line ${line})</pre>`);};

const SHEET_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vR8a2tUSBz0YwDhP-TTtSxfkeNoGG5LKassN-daKbDd2RQDUX4p38Yno6PaYYzLcVSAT_Bq95cWtiMR/pub?gid=0&single=true&output=csv';
const STAPLES_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vR8a2tUSBz0YwDhP-TTtSxfkeNoGG5LKassN-daKbDd2RQDUX4p38Yno6PaYYzLcVSAT_Bq95cWtiMR/pub?gid=188738644&single=true&output=csv';

// Paste the link you use to edit the Google Sheet between the quotes. Leave empty to hide the link.
const SHEET_EDIT_URL='https://docs.google.com/spreadsheets/d/13hRoqtHH3KLEAPcu1UomTvQtxSK7C-9tRimNdeOJnmE/edit?usp=sharing';

// Names used in the Person column of the Meals tab, and shown as ticks in the planner.
const PEOPLE=['John','Clare'];

// Ticking Guests on a planner cell adds this many extra portions, made as this person's version.
const GUEST_COUNT=2;
const GUEST_VERSION='John';

// How many weeks you can plan at once.
const WEEKS=2;

const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const SLOTS=['Lunch','Dinner'];

// Each cooking session: "on" is the weekday you normally cook (selected automatically that day),
// "days" are the plan days it covers. Day names must match DAYS exactly.
const COOKS=[
  {name:'Tuesday cook',  on:'Tuesday',  days:['Thursday','Friday','Saturday']},
  {name:'Saturday cook', on:'Saturday', days:['Sunday','Monday','Tuesday','Wednesday']}
];

// Order categories appear on the shopping list and cook cards (roughly your walk round the shop).
// Names are matched ignoring case. Categories not listed come next in alphabetical order, then Other.
const CATEGORY_ORDER=['Meat','Veg','Fruit','Dairy/Eggs','Dry Goods','Frozen','Other'];

// Cleans one week's plan. Cells become {meal: name, who: [names eating], guests: true/false}.
// Older cells (with a multiplier) default to everyone eating and no guests.
function cleanPlan(raw,oldNames){
  const plan={};
  for(const [k,v] of Object.entries(raw||{})){
    const slot=k.split('|')[1];
    if(!SLOTS.includes(slot)) continue;
    let name=null, who=PEOPLE.slice(), guests=false;
    if(typeof v==='string') name=oldNames[v];
    else if(v){
      name=v.meal||oldNames[v.id];
      if(Array.isArray(v.who)) who=PEOPLE.filter(p=>v.who.includes(p));
      guests=!!v.guests;
    }
    if(name) plan[k]={meal:name,who,guests};
  }
  return plan;
}

// Accepts current and older saved formats. An older single-week plan becomes Week 1.
function migrate(s){
  s=s||{};
  const oldNames={};
  for(const m of (s.meals||[])) if(m.id) oldNames[m.id]=m.name;
  const rawWeeks=Array.isArray(s.weeks)?s.weeks:[s.plan||{}];
  const weeks=[];
  for(let w=0;w<WEEKS;w++) weeks.push(cleanPlan(rawWeeks[w]||{},oldNames));
  // Per-week objects. An older single (non-weekly) object is kept as Week 1.
  const perWeek=(arr,old)=>{
    const out=[];
    for(let w=0;w<WEEKS;w++) out.push((Array.isArray(arr)&&arr[w])||(w===0&&old)||{});
    return out;
  };
  const tickedW=perWeek(s.tickedW,s.ticked);
  const skipW=perWeek(s.skipW,s.skipStaples);
  const viewWeek=(Number.isInteger(s.viewWeek)&&s.viewWeek>=0&&s.viewWeek<WEEKS)?s.viewWeek:0;
  const meals=(s.meals||[]).map(m=>({name:m.name,
    ingredients:(m.ingredients||[]).map(i=>({...i,person:i.person||''}))}));
  const o=s.cookOverride;
  const cookOverride=(o&&typeof o.date==='string'&&typeof o.name==='string')?{date:o.date,name:o.name}:null;
  return {weeks,meals,staples:s.staples||[],tickedW,skipW,viewWeek,cookOverride};
}

let state={weeks:Array.from({length:WEEKS},()=>({})),
           tickedW:Array.from({length:WEEKS},()=>({})),
           skipW:Array.from({length:WEEKS},()=>({})),
           viewWeek:0, cookOverride:null};
let meals=[], staples=[], catMap=new Map();
let statusMsg='', statusErr=false;
try{
  const saved=migrate(JSON.parse(localStorage.getItem('mealprep')||'null'));
  state.weeks=saved.weeks; state.tickedW=saved.tickedW; state.skipW=saved.skipW;
  state.viewWeek=saved.viewWeek; state.cookOverride=saved.cookOverride;
  meals=saved.meals; staples=saved.staples;
}catch(err){}

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(q,u)=>`${+q.toFixed(2)} ${esc(u)}`;
const skey=(n,u)=>String(n).trim().toLowerCase()+'|'+u;
const getMeal=name=>meals.find(m=>m.name.toLowerCase()===String(name).toLowerCase());
const persist=()=>localStorage.setItem('mealprep',JSON.stringify(
  {weeks:state.weeks,tickedW:state.tickedW,skipW:state.skipW,viewWeek:state.viewWeek,
   cookOverride:state.cookOverride,meals,staples}));
const save=()=>{persist();render();};

// The plan, ticks and staple choices for the week currently shown in the cards and shopping list.
const viewPlan=()=>state.weeks[state.viewWeek];
const viewTicks=()=>state.tickedW[state.viewWeek];
const viewSkips=()=>state.skipW[state.viewWeek];

// Today's date (local time) and weekday name, used for the automatic cook selection.
const todayStr=()=>{
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
};
const todayName=()=>DAYS[(new Date().getDay()+6)%7];

// A manual choice only lasts for the day it was made, then it reverts to automatic.
const overrideActive=()=>!!(state.cookOverride&&state.cookOverride.date===todayStr());

// Name of the cook currently selected, or '' for none.
function currentCook(){
  const name=overrideActive()
    ?state.cookOverride.name
    :((COOKS.find(c=>c.on===todayName())||{}).name||'');
  return COOKS.some(c=>c.name===name)?name:'';
}

// Total portions for one planner cell: people ticked, plus guests if ticked.
const portionsFor=cell=>cell.who.length+(cell.guests?GUEST_COUNT:0);

// How much of an ingredient one planner cell needs.
// Shared ingredients (no person) are per person, so they scale with the total portions.
// Person-specific ingredients count once for that person if ticked, and guests add
// GUEST_COUNT more portions of the GUEST_VERSION person's ingredients.
function amountFor(ing,cell){
  if(!ing.person) return ing.qty*portionsFor(cell);
  let n=cell.who.includes(ing.person)?1:0;
  if(cell.guests&&ing.person===GUEST_VERSION) n+=GUEST_COUNT;
  return ing.qty*n;
}

// An ingredient only needs a category once, anywhere in the sheet. First one found wins.
function buildCats(){
  catMap=new Map();
  const put=(n,c)=>{ if(!c) return; const k=String(n).trim().toLowerCase(); if(!catMap.has(k)) catMap.set(k,c); };
  for(const m of meals) for(const i of m.ingredients) put(i.name,i.cat);
  for(const s of staples) put(s.name,s.cat);
}

// Groups rows by category in shop-walk order. Returns [{label, rows}].
function groupByCategory(rows){
  const groups=new Map();
  for(const r of rows){
    const c=catMap.get(r.name.toLowerCase())||'';
    const gk=c?c.toLowerCase():'\uffff';
    if(!groups.has(gk)) groups.set(gk,{label:c||'Other',rows:[]});
    groups.get(gk).rows.push(r);
  }
  const rank=gk=>{
    if(gk==='\uffff') return 1e6;
    const i=CATEGORY_ORDER.findIndex(x=>x.toLowerCase()===gk);
    return i>=0?i:1000;
  };
  return [...groups.keys()].sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b))
    .map(gk=>{const g=groups.get(gk); g.rows.sort((a,b)=>a.name.localeCompare(b.name)); return g;});
}

function parseCSV(t){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){
      if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; }
      else f+=c;
    } else if(c==='"') q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){
      if(c==='\r'&&t[i+1]==='\n') i++;
      row.push(f);f='';rows.push(row);row=[];
    } else f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}

// Meals tab columns: Meal, Ingredient, Qty, Unit, Category (optional), Person (optional)
function parseMeals(text){
  const rows=parseCSV(text);
  if(rows.length&&String(rows[0][0]).trim().toLowerCase()==='meal') rows.shift();
  const map=new Map(); let skipped=0; const bad=new Set();
  for(const r of rows){
    if(r.every(x=>String(x).trim()==='')) continue;
    const name=String(r[0]||'').trim();
    const ing=String(r[1]||'').trim();
    const qty=parseFloat(r[2]);
    const unit=String(r[3]||'').trim().toLowerCase();
    const cat=String(r[4]||'').trim();
    const rawPerson=String(r[5]||'').trim();
    let person='';
    if(rawPerson){
      person=PEOPLE.find(p=>p.toLowerCase()===rawPerson.toLowerCase())||'';
      if(!person){bad.add(rawPerson);skipped++;continue;}
    }
    if(!name||!ing||!(qty>0)||!unit){skipped++;continue;}
    const key=name.toLowerCase();
    if(!map.has(key)) map.set(key,{name,ingredients:[]});
    map.get(key).ingredients.push({name:ing,qty,unit,cat,person});
  }
  return {meals:[...map.values()],skipped,bad:[...bad]};
}

// Staples tab columns: Item, Qty, Unit, Category (optional)
function parseStaples(text){
  const rows=parseCSV(text);
  if(rows.length&&String(rows[0][0]).trim().toLowerCase()==='item') rows.shift();
  const out=[]; let skipped=0;
  for(const r of rows){
    if(r.every(x=>String(x).trim()==='')) continue;
    const name=String(r[0]||'').trim();
    const qty=parseFloat(r[1]);
    const unit=String(r[2]||'').trim().toLowerCase();
    const cat=String(r[3]||'').trim();
    if(!name||!(qty>0)||!unit){skipped++;continue;}
    out.push({name,qty,unit,cat});
  }
  return {staples:out,skipped};
}

async function fetchCSV(url){
  const res=await fetch(url+(url.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.text();
}

async function loadSheet(){
  statusMsg='Loading from sheet...'; statusErr=false; renderStatus();
  const parts=[]; let err=false;
  try{
    const {meals:m,skipped,bad}=parseMeals(await fetchCSV(SHEET_URL));
    meals=m;
    let txt=m.length?`${m.length} meals`:'no meals in the sheet yet';
    if(skipped) txt+=` (${skipped} row(s) skipped`+(bad.length?`, unrecognised Person: ${bad.join(', ')}`:'')+')';
    parts.push(txt);
  }catch(e){err=true;parts.push(`meals failed to load (${e.message}), using last saved copy`);}
  if(STAPLES_URL){
    try{
      const {staples:s,skipped}=parseStaples(await fetchCSV(STAPLES_URL));
      staples=s;
      parts.push(s.length?`${s.length} staples`+(skipped?` (${skipped} row(s) skipped)`:''):'no staples in the sheet yet');
    }catch(e){err=true;parts.push(`staples failed to load (${e.message}), using last saved copy`);}
  }
  buildCats(); persist();
  const time=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  statusMsg=`${err?'Finished with errors':'Loaded'} at ${time}: ${parts.join('; ')}.`;
  statusErr=err;
  render();
}

function renderStatus(){
  const s=$('status'); s.textContent=statusMsg; s.className='status'+(statusErr?' err':'');
}

function renderMeals(){
  $('meals').innerHTML=meals.length?meals.map(m=>`
    <details>
      <summary><b>${esc(m.name)}</b> (${m.ingredients.length} ingredients)</summary>
      <ul>${m.ingredients.map(i=>{
        const tag=[i.cat,i.person].filter(Boolean).join(', ');
        return `<li>${esc(i.name)}: ${fmt(i.qty,i.unit)}${tag?` <span class="gray">${esc(tag)}</span>`:''}</li>`;
      }).join('')}</ul>
    </details>`).join(''):'<p>No meals loaded.</p>';
}

function renderPlan(){
  $('plannote').textContent=
    'Tick who is eating each meal. Shared ingredients scale with the number of portions. '
    +'Ingredients with a Person set in the sheet only count when that person is ticked. '
    +`Guests adds ${GUEST_COUNT} extra portions, made the ${GUEST_VERSION} way. `
    +'For extra lunches, plan them as their own Lunch or Dinner cell.';

  // In the week shown below, days covered by the selected cook are tinted and the rest fade.
  const cc=COOKS.find(c=>c.name===currentCook());
  const opts=sel=>{
    const known=sel&&getMeal(sel);
    return '<option value="">-</option>'
      +(sel&&!known?`<option value="${esc(sel)}" selected>${esc(sel)} (not in sheet)</option>`:'')
      +meals.map(m=>`<option value="${esc(m.name)}"${known&&m.name.toLowerCase()===sel.toLowerCase()?' selected':''}>${esc(m.name)}</option>`).join('');
  };

  const weekHtml=w=>{
    const plan=state.weeks[w];
    const shown=w===state.viewWeek;
    const dayCls=d=>(cc&&shown)?(cc.days.includes(d)?'dayon':'dayoff'):'';
    return `<div class="weekhead">
        <h3>Week ${w+1}${shown?' <span class="badge">shown in batch cook and shopping list</span>':''}</h3>
        <button data-clearweek="${w}">Clear all</button>
      </div>`
      +'<table><tr><th></th>'+DAYS.map(d=>`<th class="${dayCls(d)}">${d}</th>`).join('')+'</tr>'
      +SLOTS.map(s=>`<tr><th>${s}</th>`+DAYS.map(d=>{
        const cell=plan[d+'|'+s];
        const missing=cell&&!getMeal(cell.meal);
        return `<td class="${dayCls(d)}">
          <select data-week="${w}" data-day="${d}" data-slot="${s}">${opts(cell&&cell.meal)}</select>
          ${cell?`<div class="who">${PEOPLE.map(p=>
            `<label><input type="checkbox" data-week="${w}" data-day="${d}" data-slot="${s}" data-who="${esc(p)}"${cell.who.includes(p)?' checked':''}> ${esc(p)}</label>`).join('')}</div>
          <div class="guestrow"><label><input type="checkbox" data-week="${w}" data-day="${d}" data-slot="${s}" data-guests="1"${cell.guests?' checked':''}> Guests (+${GUEST_COUNT})</label></div>`:''}
          ${missing?'<div class="warn">Not in sheet, ignored in totals</div>':''}
          ${cell&&portionsFor(cell)===0?'<div class="warn">Nobody ticked, ignored in totals</div>':''}
        </td>`;
      }).join('')+'</tr>').join('')
      +'</table>';
  };
  $('plan').innerHTML=Array.from({length:WEEKS},(_,w)=>weekHtml(w)).join('');
}

function renderWeekPick(){
  $('weekpick').innerHTML='<div class="weekpick"><b>Show in batch cook and shopping list:</b>'
    +Array.from({length:WEEKS},(_,w)=>
      `<label><input type="radio" name="viewweek" data-viewweek="${w}"${w===state.viewWeek?' checked':''}> Week ${w+1}</label>`).join('')
    +'</div>';
  $('cookwk').textContent=`(Week ${state.viewWeek+1})`;
  $('shopwk').textContent=`(Week ${state.viewWeek+1})`;
}

function eatenLabel(d,s,cell){
  const t=d.slice(0,3)+' '+s.toLowerCase();
  const bits=[];
  if(!cell.who.length) bits.push(`${GUEST_COUNT} guests only`);
  else{
    if(cell.who.length!==PEOPLE.length) bits.push(cell.who.join(', ')+' only');
    if(cell.guests) bits.push(`+${GUEST_COUNT} guests`);
  }
  return bits.length?`${t} (${bits.join(', ')})`:t;
}

function renderCook(){
  const plan=viewPlan();
  const cur=currentCook();
  const manual=overrideActive();
  const today=todayName();
  const autoCook=COOKS.find(c=>c.on===today);

  let info;
  if(manual) info=`Selection set manually for today. <button data-cookauto="1">Back to automatic</button>`;
  else if(autoCook) info=`Today is ${today}, so the ${esc(autoCook.name)} is selected automatically. Untick it, or tick the other card, to override.`;
  else info=`Today is ${today}, which is not a cook day. Tick a card if you are cooking off schedule.`;

  $('cook').innerHTML=`<div class="cookinfo">${info}</div><div class="cooks">`+COOKS.map(c=>{
    const dishes=new Map();
    const totals=new Map();

    for(const d of c.days) for(const s of SLOTS){
      const cell=plan[d+'|'+s]; if(!cell||portionsFor(cell)===0) continue;
      const m=getMeal(cell.meal); if(!m) continue;
      const key=m.name.toLowerCase();
      if(!dishes.has(key)) dishes.set(key,{name:m.name,portions:0,guests:false,eat:[],meal:m,amounts:new Map()});
      const dish=dishes.get(key);
      dish.portions+=portionsFor(cell);
      if(cell.guests) dish.guests=true;
      dish.eat.push(eatenLabel(d,s,cell));
      m.ingredients.forEach((i,ix)=>{
        const a=amountFor(i,cell); if(!a) return;
        dish.amounts.set(ix,(dish.amounts.get(ix)||0)+a);
        const k=skey(i.name,i.unit);
        if(!totals.has(k)) totals.set(k,{name:i.name.trim(),unit:i.unit,qty:0});
        totals.get(k).qty+=a;
      });
    }

    const dishHtml=[...dishes.values()].map(dish=>`
      <div class="dish">
        <div class="title">Cook ${esc(dish.name)} (${dish.portions} portion${dish.portions===1?'':'s'})</div>
        <div class="eat">Eaten: ${dish.eat.map(esc).join(', ')}</div>
        <ul>${dish.meal.ingredients.map((i,ix)=>dish.amounts.has(ix)
          ?`<li>${esc(i.name)}${i.person?` (${esc(i.person)}${dish.guests&&i.person===GUEST_VERSION?', incl. guests':''})`:''}: ${fmt(dish.amounts.get(ix),i.unit)}</li>`:'').join('')}</ul>
      </div>`).join('');

    const rows=[...totals.values()];
    const totalHtml=rows.length?`
      <b>Combined ingredients</b>
      <table><tr><th>Item</th><th>Total</th></tr>${groupByCategory(rows).map(g=>
        `<tr class="cat"><td colspan="2">${esc(g.label)}</td></tr>`+g.rows.map(r=>
          `<tr><td>${esc(r.name)}</td><td>${fmt(r.qty,r.unit)}</td></tr>`).join('')).join('')}</table>`:'';

    const active=cur===c.name;
    const faded=!!cur&&!active;
    return `<div class="cook${active?' active':''}${faded?' faded':''}">
      <div class="cookhead">
        <div>
          <h3>${esc(c.name)}</h3>
          <div class="sub">Covers: ${c.days.join(', ')}</div>
        </div>
        <label class="cookpick"><input type="checkbox" data-cook="${esc(c.name)}"${active?' checked':''}> Cooking today${active&&!manual?' <span class="gray">(auto)</span>':''}</label>
      </div>
      ${dishHtml||'<p>Nothing planned for these days.</p>'}
      ${totalHtml}
    </div>`;
  }).join('')+'</div>';
}

function renderStaples(){
  const el=$('staples');
  if(!staples.length){
    el.innerHTML=STAPLES_URL
      ?'<p class="note">No staples loaded.</p>'
      :'<p class="note">Staples are not connected yet. Paste the published Staples CSV link into STAPLES_URL near the top of the file.</p>';
    return;
  }
  const skips=viewSkips();
  el.innerHTML='<div class="row"><button data-staplesall="on">Tick all</button><button data-staplesall="off">Untick all</button></div>'
    +'<div class="staplelist">'+staples.map(s=>{
      const k=skey(s.name,s.unit);
      const off=!!skips[k];
      return `<label class="${off?'off':''}"><input type="checkbox" data-staple="${esc(k)}"${off?'':' checked'}><span>${esc(s.name)}</span><span class="sq">${fmt(s.qty,s.unit)}</span></label>`;
    }).join('')+'</div>';
}

function shopTotals(){
  const totals=new Map();
  const skips=viewSkips();
  const add=(name,unit,qty)=>{
    const k=skey(name,unit);
    if(!totals.has(k)) totals.set(k,{key:k,name:name.trim(),unit,qty:0});
    totals.get(k).qty+=qty;
  };
  for(const cell of Object.values(viewPlan())){
    const m=getMeal(cell.meal); if(!m) continue;
    for(const i of m.ingredients){
      const a=amountFor(i,cell);
      if(a) add(i.name,i.unit,a);
    }
  }
  for(const s of staples){
    if(skips[skey(s.name,s.unit)]) continue;
    add(s.name,s.unit,s.qty);
  }
  return [...totals.values()];
}

function renderShop(){
  const rows=shopTotals();
  const ticks=viewTicks();
  if(!rows.length){
    $('shop').innerHTML='<p>Plan some meals to build the list.</p>';
    $('tickinfo').textContent='';
    return;
  }
  const uncat=rows.filter(r=>!catMap.get(r.name.toLowerCase())).length;
  let html='<table><tr><th class="tickcol"></th><th>Item</th><th>Total</th></tr>';
  for(const g of groupByCategory(rows)){
    html+=`<tr class="cat"><td colspan="3">${esc(g.label)}</td></tr>`;
    for(const r of g.rows){
      const done=!!ticks[r.key];
      html+=`<tr class="${done?'done':''}">
        <td class="tickcol"><input type="checkbox" data-tick="${esc(r.key)}"${done?' checked':''}></td>
        <td>${esc(r.name)}</td><td>${fmt(r.qty,r.unit)}</td></tr>`;
    }
  }
  html+='</table>';
  if(uncat) html+=`<p class="note">${uncat} item(s) have no category and are listed under Other. Add a category in the sheet to move them.</p>`;
  $('shop').innerHTML=html;
  const n=rows.filter(r=>ticks[r.key]).length;
  $('tickinfo').textContent=`${n} of ${rows.length} ticked`;
}

function render(){
  renderStatus();renderMeals();renderPlan();renderWeekPick();
  renderCook();renderStaples();renderShop();
}

$('reload').onclick=loadSheet;
$('clearTicks').onclick=()=>{state.tickedW[state.viewWeek]={};save();};

document.addEventListener('click',e=>{
  const d=e.target.dataset||{};
  if(d.cookauto){
    state.cookOverride=null; save();
  }
  if(d.staplesall){
    const skips={};
    if(d.staplesall==='off') for(const s of staples) skips[skey(s.name,s.unit)]=true;
    state.skipW[state.viewWeek]=skips;
    save();
  }
  if(d.clearweek!==undefined){
    const w=+d.clearweek;
    if(!Object.keys(state.weeks[w]).length) return;
    if(!confirm(`Clear all meals from Week ${w+1}?`)) return;
    state.weeks[w]={}; save();
  }
});

document.addEventListener('change',e=>{
  const t=e.target, d=t.dataset;
  if(d.tick!==undefined){
    const ticks=viewTicks();
    if(t.checked) ticks[d.tick]=true; else delete ticks[d.tick];
    persist(); renderShop(); return;
  }
  if(d.staple!==undefined){
    const skips=viewSkips();
    if(t.checked) delete skips[d.staple]; else skips[d.staple]=true;
    save(); return;
  }
  if(d.cook!==undefined){
    state.cookOverride={date:todayStr(),name:t.checked?d.cook:''};
    save(); return;
  }
  if(d.viewweek!==undefined){
    state.viewWeek=+d.viewweek;
    save(); return;
  }
  if(!d.day) return;
  const plan=state.weeks[+d.week];
  if(!plan) return;
  const k=d.day+'|'+d.slot;
  if(d.who!==undefined){
    const cell=plan[k]; if(!cell) return;
    cell.who=PEOPLE.filter(p=>p===d.who?t.checked:cell.who.includes(p));
  } else if(d.guests!==undefined){
    const cell=plan[k]; if(!cell) return;
    cell.guests=t.checked;
  } else if(t.value){
    const prev=plan[k];
    plan[k]={meal:t.value,who:prev?prev.who:PEOPLE.slice(),guests:prev?!!prev.guests:false};
  } else {
    delete plan[k];
  }
  save();
});

$('exp').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({weeks:state.weeks,skipW:state.skipW},null,2)],{type:'application/json'}));
  a.download='meal-plan.json'; a.click();
};
$('imp').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const imp=migrate(JSON.parse(r.result));
      state.weeks=imp.weeks; state.skipW=imp.skipW; save();
    }catch{alert('Invalid file');}
  };
  r.readAsText(f);
};

if(SHEET_EDIT_URL){const a=$('sheetlink');a.href=SHEET_EDIT_URL;a.style.display='inline';}
buildCats();
render();
loadSheet();
</script>
</body>
</html>
